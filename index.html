<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAMB E-Facility - Login</title>
  <link rel="stylesheet" href="style.css" type="text/css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
body{
    background-color: white;
    color: #fff;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

div#container {
    display: flex;
    background-color: #b8d3b3;
}

div.background-image {
    width: 100%;
    height: 600px;
    background-size: cover;
    background-position: center;
    animation: Forward 6s infinite;
}

div.background-image img {
    display: none;
}

@keyframes Forward {
    0% {
        background-image: url("images/background.jpg");
    }

    50% {
        background-image: url("images/background2.jpg");
    }

    100% {
        background-image: url("images/background.jpg");
    }
}

div#my-box {
    width: 40%;
    margin-left: 32%;
    margin-top: 3%;
    position: absolute;
    padding: 30px;
    background-color: rgb(95, 208, 119);
    border-radius: 20px;
}

div.logo {
    text-align: center;
    margin-bottom: 40px;
}

div.logo img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
}

div#my-box h2 {
    margin-bottom: 25px;
    color: #333;
}

form input {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border-radius: 20px;
}

form button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background-color: green;
    color: white;
    border-radius: 20px;
}

form p {
    text-align: center;
    margin-top: 25px;
}

form a {
    color: #810b04;
    text-decoration: none;
}
</style>
</head>

<body>

<ul>
     <li><a href="index.html">Home</a></li>
     <li><a href="page.html">Page</a></li>
</ul>

    <div id="container">

        <div class="background-image">
            <img src="background.jpg" alt="Background Image">
        </div>

        <div id="my-box">

            <div class="logo">
                <img src="images/logo.webp" alt="Logo">
                <h4>JAMB E-FACILITY</h4>
            </div>

            <h2>Login to your account</h2>

            <form>

                <label>Email Address</label>
                <input type="email" placeholder="Email Address">

                <label>Password</label>
                <input type="password" placeholder="Password">

                <button type="submit">Login</button>

                <p>Forgot your Password?
                    <a href="#">Click here to reset it.</a>
                </p>

            </form>

        </div>

    </div>
